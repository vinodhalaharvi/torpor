# Minimal. This device speaks the torpor contract over UART, so it needs a
# console, a random source for the synthetic sensors, and nothing else.
#
# Notably absent: the modem, LTE, and MQTT. The DK has no SIM, so the contract
# travels over serial and a host-side bridge republishes it. That bridge is a
# gateway in exactly the sense w10-a is a gateway for field-01 — and it is the
# more useful shape anyway, because it covers every serial-attached device:
# Modbus RTU, RS-485 sensors, older industrial gear.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Log to the same UART the contract uses. Every diagnostic line starts with #
# so the bridge can ignore it without a second port.
CONFIG_LOG=n
