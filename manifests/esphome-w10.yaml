---
# DeviceModel — the schema for a device family. One per family, and per your
# protobuf discipline it only ever grows: new properties get appended, retired
# ones are never removed or repurposed.
apiVersion: devices.kubeedge.io/v1beta1
kind: DeviceModel
metadata:
  name: esphome-w10
  namespace: default
spec:
  protocol: esphome-mqtt
  properties:
    - name: temperature
      description: SHT41 temperature
      type: FLOAT
      accessMode: ReadOnly
      unit: "°C"

    - name: humidity
      description: SHT41 relative humidity
      type: FLOAT
      accessMode: ReadOnly
      unit: "%"

    - name: link_rssi
      description: last received LoRa packet RSSI
      type: FLOAT
      accessMode: ReadOnly
      unit: "dBm"

    - name: satellites
      description: GPS satellites in view
      type: INT
      accessMode: ReadOnly

    - name: ip_address
      type: STRING
      accessMode: ReadOnly

    # --- Rollout properties -------------------------------------------------
    #
    # A firmware update is a property whose value happens to be a URL. Nothing
    # about the transport is special: the controller writes desired state, the
    # mapper delivers it, the device acts, and the device reports back.

    - name: firmware_url
      description: "<configHash>|<ociOrHttpUrl> — device pulls and flashes"
      type: STRING
      accessMode: ReadWrite

    - name: running_config_hash
      description: what the device is actually running, not what it was told
      type: STRING
      accessMode: ReadOnly

    - name: uptime
      description: seconds since boot; a falling value is a boot loop
      type: FLOAT
      accessMode: ReadOnly
      unit: s

    # V1 trigger. Patch it to any new integer and the board plays a tone, then
    # echoes the number back — so desired == reported and the device converges.
    # Actions modelled as state, the way `kubectl rollout restart` patches an
    # annotation rather than inventing a verb. Re-applying the manifest does
    # not replay the tone, which is what makes it safe under GitOps.
    - name: firmware_url
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text/firmware_url/state
          commandTopic: text/firmware_url/command

    - name: running_config_hash
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text_sensor/running_config_hash/state

    - name: uptime
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: float
          topic: sensor/uptime/state

    - name: tone_trigger
      description: write any new token to play a tone
      type: STRING
      accessMode: ReadWrite

    # V1 write path. Read-write, so it has a commandTopic in the Device below.
    - name: amp_enable
      description: NS4150 speaker amplifier
      type: STRING
      accessMode: ReadWrite

---
# Device — one per physical board.
apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: w10-a
  namespace: default
  labels:
    model: esphome-w10
    role: bench
    # Selectable by a FirmwareRollout. Both W10s are OTA-capable over WiFi.
    ota: "true"
    transport: wifi
spec:
  deviceModelRef:
    name: esphome-w10

  # Which edge node runs the mapper that reaches this device. Note the device
  # is NOT the node — the node is the thing running EdgeCore, and the device
  # hangs off it. That distinction is what lets a battery node with no agent
  # still be a first-class object later.
  nodeName: lima-edge

  protocol:
    protocolName: esphome-mqtt
    configData:
      broker: tcp://192.168.68.113:1883
      topicPrefix: w10-a
      # Retained birth/will from the ESPHome config. Drives GetDeviceStates.
      statusTopic: w10-a/status

  properties:
    - name: temperature
      collectCycle: 10000            # ms
      reportCycle: 10000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: float
          topic: sensor/temperature/state

    - name: humidity
      collectCycle: 10000            # ms
      reportCycle: 10000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: float
          topic: sensor/humidity/state

    - name: link_rssi
      collectCycle: 30000            # ms
      reportCycle: 30000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: float
          topic: sensor/link_rssi/state

    - name: satellites
      collectCycle: 30000            # ms
      reportCycle: 30000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: int
          topic: sensor/satellites/state

    - name: ip_address
      collectCycle: 60000            # ms
      reportCycle: 60000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text_sensor/ip_address/state

    - name: firmware_url
      collectCycle: 10000            # ms
      reportCycle: 10000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text/firmware_url/state
          commandTopic: text/firmware_url/command

    - name: running_config_hash
      collectCycle: 30000            # ms
      reportCycle: 30000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text_sensor/running_config_hash/state

    - name: uptime
      collectCycle: 30000            # ms
      reportCycle: 30000             # ms
      reportToCloud: true
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: float
          topic: sensor/uptime/state

    - name: tone_trigger
      collectCycle: 10000            # ms
      reportCycle: 10000             # ms
      reportToCloud: true
      desired:
        value: "0"
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: text/tone_trigger/state
          commandTopic: text/tone_trigger/command

    - name: amp_enable
      collectCycle: 10000            # ms
      reportCycle: 10000             # ms
      reportToCloud: true
      desired:
        value: "OFF"
      visitors:
        protocolName: esphome-mqtt
        configData:
          dataType: string
          topic: switch/speaker_amp/state
          commandTopic: switch/speaker_amp/command

---
# Second board. Same model, same protocol — only the topic prefix differs.
#
# Note what this is NOT: both boards are on WiFi with IPs, so both are plain
# esphome-mqtt devices. This proves the mapper handles more than one device and
# gives `kubectl get devices` two rows, but it is still V1 shaped.
#
# The V2 demo is w10-b modelled with protocol: lora and NO IP, reached through
# w10-a as a gateway. That needs a second driver and is not this.
apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: w10-b
  namespace: default
  labels:
