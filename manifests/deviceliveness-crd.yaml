---
# The first API this project owns rather than inherits.
#
# Everything below this is KubeEdge's Device and DeviceStatus with a mapper
# underneath. This is the layer above — state that KubeEdge has no vocabulary
# for, because its model assumes a device is either reachable or it is not.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devicelivenesses.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names:
    kind: DeviceLiveness
    listKind: DeviceLivenessList
    plural: devicelivenesses
    singular: deviceliveness
    shortNames: [liveness, dl]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Transport
          type: string
          jsonPath: .status.transport
        - name: State
          type: string
          jsonPath: .status.state
        - name: Silent
          type: string
          jsonPath: .status.silentFor
        - name: Assessment
          type: string
          jsonPath: .status.assessment
        - name: Gateway
          type: string
          jsonPath: .status.gateway
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                deviceRef:
                  type: string
                  description: Device this tracks. Defaults to the object's own name.
                expectedInterval:
                  type: string
                  description: >
                    How often this device is expected to report, e.g. "30s" or
                    "24h". Silence shorter than this is Online, longer is
                    Sleeping. Per-device, because a mains gateway and a battery
                    node checking in daily are both healthy at wildly different
                    rates — which a single cluster-wide timeout cannot express.
                staleMultiplier:
                  type: integer
                  description: >
                    Silence beyond expectedInterval x this is Unreachable.
                    A judgement call rather than a fact, which is why it is
                    configurable and why 3 is only a default.
                property:
                  type: string
                  description: >
                    Which reported property to measure freshness from.
                    Defaults to the freshest of any.
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [Online, Sleeping, Unreachable, Unknown]
                  description: >
                    Sleeping is a healthy steady state, not a degraded one.
                    Unreachable is a statement about our knowledge, not about
                    the hardware — a node under snow is Unreachable and
                    undamaged.
                transport:
                  type: string
                  description: >
                    State is only interpretable against this. 47 seconds of
                    silence is alarming over WiFi and unremarkable over LoRa.
                gateway:
                  type: string
                lastSeen:
                  type: string
                  format: date-time
                silentFor:
                  type: string
                nextExpectedBy:
                  type: string
                  format: date-time
                assessment:
                  type: string
                  description: >
                    Why the state is what it is, in a form a human can read
                    without knowing the thresholds. "Sleeping" alone invites
                    the question every alerting system gets wrong — is that bad?
                observedGeneration:
                  type: integer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: torpor-liveness
  namespace: kubeedge

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: torpor:liveness
rules:
  # Read the Device for its labels and protocol config, and DeviceStatus for
  # the twin timestamps. Read-only: this controller derives an opinion, it does
  # not touch device state.
  - apiGroups: ["devices.kubeedge.io"]
    resources: [devicestatuses]
    verbs: [get, list, watch]
  # The rollout controller writes firmware_url as desired state on the Device.
  # This is the only place in the project that mutates an upstream object, and
  # it does so through the same property mechanism as everything else — a
  # firmware update is a property whose value happens to be a URL.
  - apiGroups: ["devices.kubeedge.io"]
    resources: [devices]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ["fleet.torpor.io"]
    resources: [devicelivenesses, firmwarerollouts, fleetdrifts, credentialexpiries, maintenancewindows, fleetqueries, devicetemplates, devicedecommissions, deviceenrollments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["fleet.torpor.io"]
    resources: [devicelivenesses/status, firmwarerollouts/status, fleetdrifts/status, credentialexpiries/status, maintenancewindows/status, fleetqueries/status, devicetemplates/status, devicedecommissions/status, deviceenrollments/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: torpor:liveness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: torpor:liveness
subjects:
  - kind: ServiceAccount
    name: torpor-liveness
    namespace: kubeedge

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firmwarerollouts.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names:
    kind: FirmwareRollout
    listKind: FirmwareRolloutList
    plural: firmwarerollouts
    singular: firmwarerollout
    shortNames: [fr, rollout]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Target,   type: integer, jsonPath: .status.target}
        - {name: Eligible, type: integer, jsonPath: .status.eligible}
        - {name: Updated,  type: integer, jsonPath: .status.updated}
        - {name: Healthy,  type: integer, jsonPath: .status.healthy}
        - {name: Phase,    type: string,  jsonPath: .status.phase}
        - {name: Step,     type: string,  jsonPath: .status.step}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [selector, source]
              properties:
                selector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                paused:
                  type: boolean
                source:
                  type: object
                  required: [configHash]
                  properties:
                    package: {type: string}
                    configHash:
                      type: string
                      description: >
                        What the device must report about its own RUNNING state
                        to prove it applied this. Not an echo of what it was
                        told — a device can acknowledge an instruction it never
                        carried out.
                    sizeBytes: {type: integer}
                requires:
                  type: object
                  description: >
                    Checked before anything is transmitted. Produces the
                    refused list rather than a batch of timeouts hours later.
                  properties:
                    ota: {type: boolean}
                    minBatteryPercent: {type: integer}
                    maxSilentFor: {type: string}
                strategy:
                  type: object
                  properties:
                    canary: {type: integer}
                    steps:
                      type: array
                      items: {type: integer}
                      description: Cumulative percentages of ELIGIBLE, not of target.
                    maxConcurrent:
                      type: integer
                      description: >
                        Bounded by the medium, not the CPU. Exceeding a LoRa
                        duty cycle is a regulatory problem, not a slow one.
                    healthGate:
                      type: object
                      properties:
                        mustReportWithin: {type: string}
                        mustReportConfigHash: {type: boolean}
                        settleFor: {type: string}
                    rollbackOn:
                      type: object
                      properties:
                        bootLoopThreshold: {type: integer}
                        healthGateFailures: {type: integer}
                        automatic: {type: boolean}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetdrifts.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: FleetDrift, listKind: FleetDriftList, plural: fleetdrifts, singular: fleetdrift, shortNames: [drift]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Total,     type: integer, jsonPath: .status.total}
        - {name: Converged, type: integer, jsonPath: .status.converged}
        - {name: Drifted,   type: integer, jsonPath: .status.drifted}
        - {name: Unknown,   type: integer, jsonPath: .status.unknown}
        - {name: Oldest,    type: string,  jsonPath: .status.oldestDrift}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector: {type: object, x-kubernetes-preserve-unknown-fields: true}
                gracePeriod:
                  type: string
                  description: >
                    How long a device may disagree before it counts as drifted.
                    Necessary because a device mid-rollout disagrees
                    legitimately, and a sleeping node reports late rather than
                    wrongly — without this every rollout trips its own alarm.
                ignoreSleeping:
                  type: boolean
                  description: >
                    Default false. A sleeping device whose last known state was
                    wrong is still wrong, and hiding it until it wakes is how a
                    fleet quietly diverges for a month.
                expect:
                  type: object
                  properties:
                    configHash: {type: string}
                    properties: {type: object, additionalProperties: {type: string}}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: credentialexpiries.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: CredentialExpiry, listKind: CredentialExpiryList, plural: credentialexpiries, singular: credentialexpiry, shortNames: [creds, expiry]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Total,       type: integer, jsonPath: .status.total}
        - {name: Expiring,    type: integer, jsonPath: .status.expiring}
        - {name: At-Risk,     type: integer, jsonPath: .status.atRisk}
        - {name: Expired,     type: integer, jsonPath: .status.expired}
        - {name: Next-Expiry, type: string,  jsonPath: .status.nextExpiry}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector: {type: object, x-kubernetes-preserve-unknown-fields: true}
                expiryProperty:
                  type: string
                  description: >
                    Property the device reports its own expiry through. The
                    device knows when its certificate dies; nothing else
                    reliably does.
                warnBefore:
                  type: string
                  description: >
                    Long by default. The useful output is a work order rather
                    than an alert — a truck roll to a remote site is scheduled
                    in weeks.
                rotationSizeBytes:
                  type: integer
                  description: >
                    Checked against each transport's capacity. This is what
                    turns "expires in 60 days" into "expires in 60 days and
                    cannot be rotated remotely".
                requiredContactWindow:
                  type: string
                  description: >
                    Being briefly reachable is not the same as being
                    rotatable. A node surfacing for 30s a day cannot receive a
                    credential that takes two minutes to transfer.
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maintenancewindows.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: MaintenanceWindow, listKind: MaintenanceWindowList, plural: maintenancewindows, singular: maintenancewindow, shortNames: [mw, window]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Open,      type: boolean, jsonPath: .status.open}
        - {name: Devices,   type: integer, jsonPath: .status.matchedDevices}
        - {name: Next-Open, type: string,  jsonPath: .status.nextOpen}
        - {name: Reason,    type: string,  jsonPath: .status.reason}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector: {type: object, x-kubernetes-preserve-unknown-fields: true}
                timezone:
                  type: string
                  description: >
                    IANA name. Looks optional and is not: a window that
                    silently means UTC will be wrong twice a year in every
                    country with daylight saving, and it will be wrong at 2am.
                allowInFlightToComplete:
                  type: boolean
                  description: >
                    Default true. Aborting a firmware transfer at a window
                    boundary leaves a half-written device, which is a brick.
                    A window is about when to start.
                maxDevicesPerWindow:
                  type: integer
                  description: >
                    A blast-radius limit, not a rate limit. If an update turns
                    out bad, this is how many devices break before anyone
                    notices.
                allow: &period
                  type: array
                  items:
                    type: object
                    properties:
                      cron: {type: string}
                      duration: {type: string}
                      from: {type: string, format: date-time}
                      until: {type: string, format: date-time}
                      reason:
                        type: string
                        description: >
                          Shown to whoever wonders why their rollout is
                          waiting. "Why is nothing happening" is the question
                          this object generates; the answer should be in it.
                deny: *period
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetqueries.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: FleetQuery, listKind: FleetQueryList, plural: fleetqueries, singular: fleetquery, shortNames: [fq, query]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Matched,   type: integer, jsonPath: .status.matched}
        - {name: Evaluated, type: integer, jsonPath: .status.evaluated}
        - {name: Last-Run,  type: string,  jsonPath: .status.lastEvaluated}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                labels: {type: object, x-kubernetes-preserve-unknown-fields: true}
                limit:
                  type: integer
                  description: >
                    Caps the device list; counts stay accurate. A query
                    matching 5000 devices would otherwise write an object too
                    large for etcd.
                where:
                  type: object
                  description: >
                    A conjunction — every field set must hold. Deliberately not
                    an expression language: an operator at 3am should be able
                    to tell what this selects without evaluating precedence.
                  x-kubernetes-preserve-unknown-fields: true
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devicetemplates.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: DeviceTemplate, listKind: DeviceTemplateList, plural: devicetemplates, singular: devicetemplate, shortNames: [dt, template]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Instances,    type: integer, jsonPath: .status.instances}
        - {name: Created,      type: integer, jsonPath: .status.created}
        - {name: Orphaned,     type: integer, jsonPath: .status.orphaned}
        - {name: Last-Applied, type: string,  jsonPath: .status.lastApplied}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [deviceModelRef]
              properties:
                deviceModelRef: {type: string}
                prune:
                  type: boolean
                  description: >
                    Default false, and the default is the point. A device
                    vanishing from a template is far more likely to be an
                    editing mistake than a decommissioning, and the costs are
                    not symmetrical — a stale Device is clutter, a deleted one
                    takes its twin history with it.
                labels: {type: object, additionalProperties: {type: string}}
                protocol:
                  type: object
                  properties:
                    name: {type: string}
                    configData: {type: object, additionalProperties: {type: string}}
                properties:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      collectCycle: {type: integer}
                      reportCycle: {type: integer}
                      reportToCloud: {type: boolean}
                      desired: {type: string}
                      visitors: {type: object, additionalProperties: {type: string}}
                instances:
                  type: array
                  description: >
                    Inline rather than referenced. A fleet's device list is the
                    most valuable thing in the cluster and should be reviewable
                    in a diff.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      vars: {type: object, additionalProperties: {type: string}}
                      labels: {type: object, additionalProperties: {type: string}}
                      overrides:
                        type: object
                        additionalProperties: {type: string}
                        description: >
                          Calibration offsets live here. An offset is a
                          measured property of one physical object, discovered
                          after deployment, and it belongs next to that object.
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devicedecommissions.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: DeviceDecommission, listKind: DeviceDecommissionList, plural: devicedecommissions, singular: devicedecommission, shortNames: [decom]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Device,       type: string, jsonPath: .spec.deviceRef}
        - {name: Reason,       type: string, jsonPath: .spec.reason}
        - {name: Phase,        type: string, jsonPath: .status.phase}
        - {name: Service-Life, type: string, jsonPath: .status.serviceLife}
        - {name: Replacement,  type: string, jsonPath: .spec.replacement, priority: 1}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [deviceRef, reason]
              properties:
                deviceRef: {type: string}
                reason:
                  type: string
                  enum: [Stolen, Failed, BatteryExpired, Retired, Replaced, Transferred, NeverDeployed]
                  description: >
                    Required. There is no sensible default, and a decommission
                    without one is a mystery six months later when somebody
                    asks why the site has four sensors instead of five.
                detail: {type: string}
                effectiveFrom:
                  type: string
                  format: date-time
                  description: >
                    Backdates it. The paperwork always lags the event — a
                    device stolen on Tuesday and noticed on Friday should not
                    leave three days of unexplained unreachability in the
                    history.
                revokeCredentials:
                  type: boolean
                  description: >
                    Default true. A device removed for theft that keeps working
                    credentials is a security problem, not a bookkeeping one.
                deleteDeviceObject:
                  type: boolean
                  description: >
                    Default FALSE, and that is the point of this object: the
                    device stops counting without ceasing to have existed.
                replacement:
                  type: string
                  description: >
                    "This site has had four sensors in three years" is a fact
                    about the site, and a chain of replacements is the only way
                    to see it.
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deviceenrollments.fleet.torpor.io
spec:
  group: fleet.torpor.io
  scope: Namespaced
  names: {kind: DeviceEnrollment, listKind: DeviceEnrollmentList, plural: deviceenrollments, singular: deviceenrollment, shortNames: [enroll]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Enrolled, type: integer, jsonPath: .status.enrolled}
        - {name: Pending,  type: integer, jsonPath: .status.pendingCount}
        - {name: Rejected, type: integer, jsonPath: .status.rejectedCount}
        - {name: Auto,     type: boolean, jsonPath: .spec.autoApprove, priority: 1}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                announceTopic: {type: string}
                broker: {type: string}
                nodeName: {type: string}
                autoApprove:
                  type: boolean
                  description: >
                    Default false and it should stay false anywhere that
                    matters. An announcement is a claim from an unauthenticated
                    source; auto-approving lets anybody who can reach the
                    broker add devices to your fleet and have your rollouts
                    push firmware at them.
                requireTemplate:
                  type: string
                  description: >
                    Only approve devices named as instances of this template.
                    You already wrote down which devices you ordered.
                allowedModels: {type: array, items: {type: string}}
                labels: {type: object, additionalProperties: {type: string}}
                expirePendingAfter:
                  type: string
                  description: >
                    A pending list nobody has cleared is a pending list nobody
                    reads.
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
